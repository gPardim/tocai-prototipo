<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tocaí — protótipo</title>
<style>
:root{--bg:#ececec;--app:#f7f7f7;--card:#fff;--ink:#3e3e3e;--mut:#717171;--line:#eaeaea;--pri:#d4001b;--onpri:#fff;--ok:#1f7a46;--wait:#9a5b00;--soft:#fdecee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--app:#141414;--card:#1e1e1e;--ink:#f1f1f1;--mut:#a3a3a3;--line:#2f2f2f;--pri:#ff4a58;--onpri:#1a1a1a;--ok:#4cc585;--wait:#f0b04f;--soft:#3a1a1e}}
:root[data-theme="dark"]{--bg:#0d0d0d;--app:#141414;--card:#1e1e1e;--ink:#f1f1f1;--mut:#a3a3a3;--line:#2f2f2f;--pri:#ff4a58;--onpri:#1a1a1a;--ok:#4cc585;--wait:#f0b04f;--soft:#3a1a1e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 10px}
.roles{display:flex;gap:6px;margin-bottom:12px;background:var(--card);padding:4px;border-radius:999px;border:1px solid var(--line)}
.roles button{border:0;background:none;color:var(--mut);padding:8px 18px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.roles button.on{background:var(--pri);color:var(--onpri)}
.wrap{position:relative;width:100%;max-width:390px}
.phone{height:730px;max-height:calc(100vh - 90px);min-height:540px;background:var(--app);border-radius:30px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.14);position:relative}
.head{background:var(--card);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.head h1{font-size:18px;margin:0;flex:1}
.back{border:0;background:none;color:var(--pri);font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.loc{font-size:12px;color:var(--mut)}.loc b{display:block;color:var(--ink);font-size:15px}
.body{flex:1;overflow:auto;padding:12px 16px 16px}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
.nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.nav button span{display:block;font-size:20px;line-height:1.2}
.nav button.on{color:var(--pri)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search input{border:0;background:none;color:var(--ink);font:inherit;padding:12px 0;width:100%;outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.promo{background:var(--pri);color:var(--onpri);border-radius:16px;padding:16px;margin-bottom:6px;display:flex;align-items:center;gap:12px;cursor:pointer}
.promo b{font-size:17px;display:block}.promo small{opacity:.9}.promo .e{font-size:40px}
h2{font-size:17px;margin:18px 0 10px}
.place{display:flex;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line);cursor:pointer}
.place.off{opacity:.6;cursor:default}
.thumb{width:62px;height:62px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:28px;flex:none}
.place b{display:block}.mut{color:var(--mut);font-size:13px}
.star{color:var(--wait);font-weight:700}
.live{color:var(--ok);font-weight:700;font-size:13px}
.cover{height:130px;margin:-12px -16px 0;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:56px}
.info{padding:14px 0 4px}.info h2{margin:0 0 4px;font-size:21px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card b.big{font-size:17px;display:block}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .t{flex:1;min-width:0}.row b{display:block}
.pos{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.add{border:0;background:var(--pri);color:var(--onpri);width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.cta{position:absolute;left:16px;right:16px;bottom:68px;border:0;background:var(--pri);color:var(--onpri);padding:14px;border-radius:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.btn{display:block;width:100%;border:0;background:var(--pri);color:var(--onpri);padding:13px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--soft);color:var(--pri)}.btn.ok{background:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;gap:4px;margin:10px 0 6px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--ok)}.steps.bad i.on{background:var(--pri)}
.tag{font-size:12px;font-weight:800}.tag.w{color:var(--wait)}.tag.c{color:var(--ok)}.tag.r{color:var(--pri)}
label{font-size:13px;font-weight:700;color:var(--mut)}
.in{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink);margin:4px 0 8px}
.stats{display:flex;gap:8px;margin-bottom:10px}.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mut)}.stats b{font-size:22px;display:block;color:var(--ink)}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 14px}.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.seg button.on{background:var(--pri);color:var(--onpri)}.logo{text-align:center;font-size:44px;margin-top:18px}.logo b{display:block;font-size:26px;color:var(--pri)}.opt{display:flex;gap:8px;margin-bottom:10px}.opt button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.opt button.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}.btn.out{background:none;color:var(--mut);border:1px solid var(--line)}.add{width:48px;height:48px;font-size:22px}
.back{min-width:48px;min-height:48px;display:grid;place-items:center}
.chip,.seg button,.opt button{min-height:48px}
.btn{min-height:48px}
.in,.search{min-height:48px}
.nav button{min-height:56px}
.hy{min-height:48px;min-width:48px;border:1px solid var(--line);background:var(--soft);color:var(--pri);border-radius:12px;font:inherit;font-weight:800;cursor:pointer;padding:0 12px}
.mode{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--pri)}
</style>
</head>
<body>
<div class="wrap"><div class="phone" id="phone"></div><div class="toast" id="toast"></div></div>
<script>
const SONGS=[["Evidências","Chitãozinho & Xororó"],["Notificação Preferida","Zé Neto & Cristiano"],["Anna Júlia","Los Hermanos"],["Trem-Bala","Ana Vilela"],["Tempo Perdido","Legião Urbana"],["Tocando em Frente","Almir Sater"],["Wonderwall","Oasis"],["Como É Grande o Meu Amor por Você","Roberto Carlos"]];
const PLACES=[["🎸","Boate Azul","120 m"],["🍻","Bar do Zeca","450 m"],["🍽️","Restaurante Cantiga","800 m"]];
const RT={m:{"Banda Vento Sul":[5,4,5,5],"Duo Maré":[4,4,5],"Lia Duarte":[]},e:{"Boate Azul":[5,4,5,4,5],"Bar do Zeca":[4,4],"Restaurante Cantiga":[5,4,5]}};
const AVAL=[];
const AP=[
{who:"Banda Vento Sul",local:"Boate Azul",quando:"Hoje · 20:00",st:"on",codigo:"AZ4821",modo:"livre",limite:2,rep:[],q:[{m:"Evidências",who:"Mesa 4",s:"w",h:"20:05",hy:[]},{m:"Notificação Preferida",who:"Mesa 9",s:"w",h:"20:07",hy:["Mesa 2"]},{m:"Anna Júlia",who:"Mesa 2",s:"w",h:"20:09",hy:["Mesa 3","Mesa 5"]}]},
{who:"Banda Vento Sul",local:"Boate Azul",quando:"Sex · 22:00",st:"next",codigo:"AZ7305",modo:"repertorio",limite:2,rep:[],q:[]},
{who:"Duo Maré",local:"Boate Azul",quando:"Sáb · 21:30",st:"next",codigo:"AZ1190",modo:"livre",limite:2,rep:[],q:[]},
{who:"Banda Vento Sul",local:"Boate Azul",quando:"Qui · 20:00",st:"done",codigo:"AZ3310",modo:"repertorio",limite:2,rep:[SONGS[4],SONGS[3],SONGS[6],SONGS[0]],q:[{m:"Tempo Perdido",who:"Mesa 1",s:"c",h:"20:12",a:"20:15",hy:[]},{m:"Wonderwall",who:"Mesa 6",s:"r",h:"20:20",a:"20:22",hy:[]},{m:"Trem-Bala",who:"Você",s:"c",h:"20:25",a:"20:30",hy:[]}]}];
const MUS=[{n:"Banda Vento Sul"},{n:"Duo Maré"},{n:"Lia Duarte"}];
const DEMO={c:"Ana Souza",m:"Banda Vento Sul",d:"Carlos Mendes"};
let user=null,last=null,tab="in",nr="c",scr="home",sel=0,busca="",ordem="nome",verif=null,retorno="buscar";
const $=s=>document.querySelector(s);
const hora=()=>new Date().toTimeString().slice(0,5);
const ST={w:["Na fila","w"],c:["Concluída","c"],r:["Recusada","r"],x:["Cancelada","r"]};
const SA={on:["Em andamento","c"],next:["Agendada","w"],done:["Encerrada","r"]};
const gerarCodigo=()=>"TC"+Math.floor(1000+Math.random()*9000);
const act=()=>AP.find(a=>a.st==="on");
const pend=a=>a.q.map((x,i)=>[x,i]).filter(p=>p[0].s==="w").sort((p,q)=>q[0].hy.length-p[0].hy.length||p[1]-q[1]).map(p=>p[0]);
const hist=a=>a.q.filter(x=>x.s==="c"||x.s==="r");
const lista=a=>a.modo==="repertorio"?a.rep:SONGS;
const usados=a=>a.q.reduce((n,x)=>n+x.hy.filter(h=>h==="Você").length,0);
const media=(t,k)=>{const l=RT[t][k]||[];return l.length?(l.reduce((a,b)=>a+b,0)/l.length).toFixed(1).replace(".",",")+" ("+l.length+")":"sem notas"};
const NAV={c:[["home","🏠","Início"],["perfil","👤","Perfil"]],m:[["agenda","📅","Agenda"],["perfil","👤","Perfil"]],d:[["agenda","📅","Apresentações"],["perfil","👤","Perfil"]]};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
const go=x=>{scr=x;render()};
const abrirAp=i=>{sel=i;go("apres")};
function enter(r,n,e){user={role:r,name:n,est:e||"Boate Azul"};last=user;scr=NAV[r][0][0];if(r==="m"&&!MUS.some(x=>x.n===n)){MUS.push({n});RT.m[n]=[]}render()}
function cadastrar(){const n=$("#nm").value.trim()||DEMO[nr],e=nr==="d"?($("#en").value.trim()||"Meu Bar"):"";if(nr==="d")RT.e[e]=RT.e[e]||[];enter(nr,n,e);toast("Conta criada!")}
function entrar(){if(last)enter(last.role,last.name,last.est);else toast("Crie uma conta ou use o acesso rápido")}
const sair=()=>{user=null;render()};
function irSolicitar(){retorno="buscar";const a=act();go(verif&&verif.a===a?"buscar":"presenca")}
function confCodigo(){const v=$("#cod").value.trim().toUpperCase();if(v===act().codigo){verif={a:act(),m:"código"};toast("Presença confirmada pelo código");go(retorno)}else toast("Código incorreto")}
function usarLoc(longe){if(longe){toast("Você está a mais de 100 m do bar");return}verif={a:act(),m:"localização"};toast("Você está a 40 m do bar");go(retorno)}
function pedir(m){const a=act();if(a.q.some(x=>x.who==="Você"&&x.s==="w")){toast("Você já tem uma solicitação na fila");return}if(a.q.some(x=>x.m===m&&x.s==="w")){toast("Essa música já está na fila. Use o hype para subi-la");return}a.q.push({m,who:"Você",s:"w",h:hora(),v:verif.m,hy:[]});toast("Solicitação enviada!");go("perfil")}
function hypar(j){const a=act(),x=a.q[j];if(!verif||verif.a!==a){retorno="est";toast("Confirme a presença para hypar");go("presenca");return}
 if(x.who==="Você"){toast("Você não pode hypar a própria solicitação");return}if(x.hy.includes("Você")){toast("Você já hypou esta música");return}if(usados(a)>=a.limite){toast("Seus hypes acabaram nesta apresentação");return}
 x.hy.push("Você");toast("Hype enviado! Restam "+(a.limite-usados(a)));render()}
function cancelar(i,j){const x=AP[i].q[j];if(pend(AP[i])[0]===x){toast("A primeira da fila não pode ser cancelada");return}x.s="x";toast("Solicitação cancelada");render()}
function resp(s){const n=pend(AP[sel])[0];n.s=s;n.a=hora();toast(s==="c"?"Música concluída":"Música recusada");render()}
function toggleAp(i){const a=AP[i];if(a.st==="on"){a.st="done";toast("Apresentação encerrada")}else{if(a.modo==="repertorio"&&!a.rep.length){toast("Repertório vazio: o músico precisa montá-lo antes");return}const o=act();if(o)o.st="done";a.st="on";toast("Apresentação iniciada")}render()}
function criarAp(){const l=parseInt($("#lh").value,10);AP.push({who:$("#ms").value,local:user.est,quando:$("#dt").value||"Data a definir",st:"next",codigo:($("#cd").value.trim()||gerarCodigo()).toUpperCase(),modo:$("#md").value,limite:l>=0?l:2,rep:[],q:[]});toast("Apresentação criada");render()}
function addRep(i,k){const a=AP[i];if(a.rep.includes(SONGS[k])){toast("Já está no repertório");return}a.rep.push(SONGS[k]);toast("Adicionada ao repertório");render()}
function remRep(i,k){AP[i].rep.splice(k,1);render()}
function copiarRep(i){const a=AP[i],ant=AP.filter(x=>x!==a&&x.who===a.who&&x.st==="done"&&x.rep.length).slice(-1)[0];a.rep=ant.rep.slice();toast("Repertório copiado");render()}
function avaliar(i,t,n){const a=AP[i],de=user.role+user.name;if(AVAL.some(v=>v.i===i&&v.de===de&&v.t===t)){toast("Você já avaliou");return}AVAL.push({i,de,t});RT[t][t==="m"?a.who:a.local].push(n);toast("Avaliação enviada: "+n+" ★");render()}
const stars=(i,t)=>`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">${[1,2,3,4,5].map(k=>`<button class="hy" aria-label="Nota ${k} de 5" onclick="avaliar(${i},'${t}',${k})">${k}★</button>`).join("")}</div>`;
const jaAv=(i,t)=>AVAL.some(v=>v.i===i&&v.de===user.role+user.name&&v.t===t);
function avalBlock(i){const a=AP[i],r=user.role,l=[];
 if(r==="c"&&a.q.some(x=>x.who==="Você")){l.push(["m","Avaliar o músico "+a.who]);l.push(["e","Avaliar "+a.local])}
 if(r==="m"&&a.who===user.name)l.push(["e","Avaliar "+a.local]);
 if(r==="d"&&a.local===user.est)l.push(["m","Avaliar o músico "+a.who]);
 const p=l.filter(x=>!jaAv(i,x[0]));return p.map(x=>`<div class="card"><b>${x[1]}</b>${stars(i,x[0])}</div>`).join("")}
function songRows(t,src){t=t.toLowerCase();return(src||SONGS).filter(s=>(s[0]+s[1]).toLowerCase().includes(t)).map(s=>`<div class="row"><div class="thumb" style="width:44px;height:44px;font-size:20px">🎵</div><div class="t"><b>${s[0]}</b><span class="mut">${s[1]}</span></div><button class="add" aria-label="Solicitar ${s[0]}" onclick="pedir(this.dataset.m)" data-m="${s[0]}">+</button></div>`).join("")||'<p class="mut">Nenhuma música encontrada.</p>'}
function repRows(i,t){t=t.toLowerCase();const a=AP[i];return SONGS.filter(s=>!a.rep.includes(s)&&(s[0]+s[1]).toLowerCase().includes(t)).map(s=>`<div class="row"><div class="t"><b>${s[0]}</b><span class="mut">${s[1]}</span></div><button class="add" aria-label="Adicionar ${s[0]}" onclick="addRep(${i},${SONGS.indexOf(s)})">+</button></div>`).join("")||'<p class="mut">Nenhuma música para adicionar.</p>'}
function placeList(){const d=p=>parseFloat(p[2]),n=p=>{const l=RT.e[p[1]];return l.length?l.reduce((a,b)=>a+b,0)/l.length:0};let l=PLACES.filter(p=>p[1].toLowerCase().includes(busca.toLowerCase()));
 l=ordem==="perto"?l.sort((x,y)=>d(x)-d(y)):ordem==="nota"?l.sort((x,y)=>n(y)-n(x)):l.sort((x,y)=>x[1].localeCompare(y[1]));
 return l.map(p=>{const live=p[1]==="Boate Azul"&&act();return `<div class="place ${live?"":"off"}" ${live?"onclick=\"go('est')\"":""}><div class="thumb">${p[0]}</div><div><b>${p[1]}</b><span class="mut"><span class="star">★ ${media("e",p[1])}</span> · ${p[2]}</span><br>${live?'<span class="live">● Show ao vivo agora</span>':'<span class="mut">Sem show no momento</span>'}</div></div>`}).join("")||'<p class="mut">Nenhum estabelecimento encontrado.</p>'}
function meus(){const l=[];AP.forEach((a,i)=>a.q.forEach((x,j)=>{if(x.who==="Você")l.push([a,x,i,j])}));return l.map(([a,x,i,j])=>{const p=pend(a).indexOf(x)+1,d=x.s!=="w";return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${x.m}</b><span class="tag ${ST[x.s][1]}">${d?ST[x.s][0]:"Posição "+p}</span></div><span class="mut">${a.local} · solicitada às ${x.h}${x.hy.length?" · "+x.hy.length+" hype(s)":""}</span><div class="steps ${x.s==="r"||x.s==="x"?"bad":""}"><i class="on"></i><i class="${x.s==="w"&&p===1||x.s==="c"||x.s==="r"?"on":""}"></i><i class="${x.s==="c"||x.s==="r"?"on":""}"></i></div><span class="mut">${x.s==="w"?(p===1?"É a próxima! O músico vai responder em instantes.":"Aguardando a vez na fila"):x.s==="c"?"O músico cantou sua música 🎉":x.s==="r"?"O músico não vai tocar esta. Você já pode solicitar outra!":"Você cancelou esta solicitação."}</span>${x.s==="w"&&p>1?`<button class="btn alt" onclick="cancelar(${i},${j})">Cancelar solicitação</button>`:""}</div>`}).join("")||'<div class="card"><b>Nenhuma solicitação ainda</b><span class="mut">Entre em um estabelecimento com show ao vivo e solicite sua música.</span></div>'}
const sairBtn='<button class="btn out" onclick="sair()">Sair da conta</button>';
const field=(l,v)=>`<label>${l}</label><input class="in" value="${v}">`;
const modoTxt=a=>a.modo==="livre"?"Modo Livre":"Modo Repertório";
function histBlock(a){const d=hist(a),c=d.filter(x=>x.s==="c").length;return `<h2>Histórico desta apresentação</h2><div class="stats"><div><b>${c}</b>cantadas</div><div><b>${d.length-c}</b>recusadas</div><div><b>${pend(a).length}</b>pendentes</div></div>`+(d.map(x=>`<div class="row"><div class="t"><b>${x.m}</b><span class="mut">${x.who} · solicitada ${x.h} · atendida ${x.a}</span></div><span class="tag ${ST[x.s][1]}">${ST[x.s][0]}</span></div>`).join("")||'<p class="mut">Nenhuma música atendida ainda.</p>')}
function filaBlock(a){const p=pend(a),n=p[0],m=user.role==="m";return `<h2>Fila</h2>`+(n?`<div class="card" style="border:2px solid var(--pri)"><span class="mut">Próxima da fila · ▲ ${n.hy.length} hype(s)</span><b class="big" style="font-size:22px">${n.m}</b><span class="mut">${n.who} · solicitada às ${n.h}</span>${m?`<div class="two"><button class="btn ok" onclick="resp('c')">Cantar</button><button class="btn" onclick="resp('r')">Recusar</button></div>`:""}</div>`:`<div class="card"><b class="big">Fila vazia</b><span class="mut">Novas solicitações aparecem aqui em tempo real.</span></div>`)+p.slice(1).map((x,i)=>`<div class="row"><span class="pos">${i+2}</span><div class="t"><b>${x.m}</b><span class="mut">▲ ${x.hy.length} hype(s)</span></div></div>`).join("")+(m?`<p class="mut">A ordem é por hypes e, em empate, por chegada. Só a primeira pode ser tratada.</p>`:"")}
function apCard(a,i,dono){const d=hist(a),c=d.filter(x=>x.s==="c").length,b=[`<button class="btn alt" onclick="abrirAp(${i})">${a.st==="on"&&!dono?"Abrir fila ("+pend(a).length+")":a.st==="next"?"Detalhes":"Ver histórico"}</button>`];
 if(!dono&&a.modo==="repertorio"&&a.st!=="done")b.push(`<button class="btn alt" onclick="sel=${i};go('repert')">Repertório (${a.rep.length})</button>`);
 if(dono&&a.st!=="done")b.push(`<button class="btn" onclick="toggleAp(${i})">${a.st==="on"?"Encerrar":"Iniciar"}</button>`);
 return `<div class="card" ${a.st==="on"?'style="border:2px solid var(--pri)"':""}><div style="display:flex;justify-content:space-between"><b>${dono?a.who:a.local}</b><span class="tag ${SA[a.st][1]}">${SA[a.st][0]}</span></div><span class="mut">${a.quando} · ${modoTxt(a)}${dono?" · Código "+a.codigo+" · Hype "+a.limite:""}${a.st!=="next"?` · ${c} cantadas · ${d.length-c} recusadas`:""}</span><div class="two">${b.join("")}</div></div>`}
function view(){
 const r=user.role;
 if(r==="c"){
  if(scr==="home")return{t:`<div class="loc">Estou em<b>Perto de você ⌄</b></div>`,b:`<div class="search">🔍<input value="${busca}" placeholder="Buscar bar ou restaurante" aria-label="Buscar" oninput="busca=this.value;$('#pl').innerHTML=placeList()"></div><div class="chips">${[["nome","Por nome"],["perto","Perto de mim"],["nota","Melhor nota"]].map(o=>`<button class="chip ${ordem===o[0]?"on":""}" onclick="ordem='${o[0]}';render()">${o[1]}</button>`).join("")}</div>${act()?`<div class="promo" onclick="go('est')"><span class="e">🎤</span><div><b>Show ao vivo agora</b><small>Boate Azul · veja a fila e solicite sua música</small></div></div>`:""}<h2>Estabelecimentos</h2><div id="pl">${placeList()}</div>`};
  if(scr==="est"){const a=act(),ok=a&&verif&&verif.a===a;return{t:"Boate Azul",back:"home",b:`<div class="cover">🎸</div><div class="info"><h2>Boate Azul</h2><span class="mut"><span class="star">★ ${media("e","Boate Azul")}</span> · 120 m</span></div>`+(a?`<div class="card"><span class="live">● Tocando agora</span><b class="big">${a.who}</b><span class="mut"><span class="mode">${modoTxt(a)}</span> · ${a.modo==="repertorio"?"só músicas do repertório":"qualquer música"} · ★ ${media("m",a.who)}</span></div><h2>Fila de músicas (${pend(a).length})</h2><p class="mut" style="margin-top:-4px">Mais hypes sobem na fila. Seus hypes: ${a.limite-usados(a)} de ${a.limite}.</p>${pend(a).map((x,i)=>`<div class="row"><span class="pos">${i+1}</span><div class="t"><b>${x.m}</b><span class="mut">▲ ${x.hy.length} hype(s)</span></div>${x.who==="Você"?'<span class="tag w">Sua</span>':`<button class="hy" aria-label="Hypar ${x.m}" onclick="hypar(${a.q.indexOf(x)})">▲ Hype</button>`}</div>`).join("")||'<p class="mut">A fila está vazia. Solicite a primeira música!</p>'}<div style="height:70px"></div>`:`<div class="card"><b class="big">Sem show no momento</b><span class="mut">As solicitações abrem quando uma apresentação começar.</span></div>`),cta:a?"Solicitar uma música":""}}
  if(scr==="presenca")return{t:"Confirmar presença",back:"est",b:`<div class="card"><b class="big">Você está no bar?</b><span class="mut">Para solicitar ou hypar, confirme que está na Boate Azul: digite o código da apresentação (veja no bar) ou use sua localização.</span></div><label>Código da apresentação</label><input class="in" id="cod" placeholder="Ex.: AZ4821" autocapitalize="characters"><button class="btn" onclick="confCodigo()">Confirmar código</button><button class="btn alt" onclick="usarLoc(false)">Usar minha localização</button><button class="btn out" onclick="usarLoc(true)">Simular: estou longe do bar</button><p class="mut">Sua posição é comparada no aparelho e não é guardada.</p>`};
  if(scr==="buscar"){const a=act();return{t:"Solicitar música",back:"est",b:`<div class="card"><span class="mode">${modoTxt(a)}</span> <span class="mut">${a.modo==="repertorio"?"Escolha uma das músicas que o músico preparou.":"Busque qualquer música no Deezer."}</span></div><div class="search">🔍<input id="busca" placeholder="Buscar música ou artista" oninput="$('#res').innerHTML=songRows(this.value,lista(act()))" aria-label="Buscar música"></div><div id="res">${songRows("",lista(a))}</div>`}}
  return{t:"Perfil",b:`<div class="card" style="text-align:center"><div class="thumb" style="margin:0 auto 6px">🙂</div><b class="big">${user.name}</b><span class="mut">Cliente</span></div><h2>Avaliações pendentes</h2>${AP.map((a,i)=>a.st==="done"?avalBlock(i):"").join("")||'<p class="mut">Nenhuma avaliação pendente.</p>'}<h2>Minhas solicitações</h2>${meus()}${sairBtn}`};
 }
 if(scr==="apres"){const a=AP[sel];return{t:a.st==="on"&&r==="m"?"Fila ao vivo":"Apresentação",back:"agenda",b:`<div class="card"><div style="display:flex;justify-content:space-between"><b class="big">${r==="d"?a.who:a.local}</b><span class="tag ${SA[a.st][1]}">${SA[a.st][0]}</span></div><span class="mut">${a.quando} · ${modoTxt(a)}${r==="d"?" · Código "+a.codigo+" · Hype "+a.limite:""}</span>${r==="d"&&a.st!=="done"?`<button class="btn" onclick="toggleAp(${sel})">${a.st==="on"?"Encerrar apresentação":"Iniciar apresentação"}</button>`:""}</div>`+(a.st==="on"?filaBlock(a):"")+(a.st==="next"?'<p class="mut">O histórico aparece depois que a apresentação começar.</p>':histBlock(a))+(a.st==="done"?avalBlock(sel):"")}}
 if(scr==="repert"){const a=AP[sel],ant=AP.filter(x=>x!==a&&x.who===a.who&&x.st==="done"&&x.rep.length).slice(-1)[0];return{t:"Repertório",back:"agenda",b:`<p class="mut" style="margin-top:0">${a.local} · ${a.quando} · ${a.rep.length} música(s)</p>`+(a.st!=="done"&&ant&&!a.rep.length?`<button class="btn alt" onclick="copiarRep(${sel})">Copiar do show anterior (${ant.rep.length} músicas)</button>`:"")+(a.rep.map((m,k)=>`<div class="row"><div class="t"><b>${m[0]}</b><span class="mut">${m[1]}</span></div><button class="hy" aria-label="Remover ${m[0]}" onclick="remRep(${sel},${k})">Remover</button></div>`).join("")||'<p class="mut">Repertório vazio. Adicione músicas para poder iniciar a apresentação.</p>')+`<h2>Adicionar músicas (Deezer)</h2><div class="search">🔍<input placeholder="Buscar música ou artista" aria-label="Buscar música" oninput="$('#rres').innerHTML=repRows(${sel},this.value)"></div><div id="rres">${repRows(sel,"")}</div>`}}
 if(r==="m"){
  if(scr==="agenda"){const l=AP.map((a,i)=>[a,i]).filter(x=>x[0].who===user.name);return{t:"Agenda de apresentações",b:l.map(([a,i])=>apCard(a,i,false)).join("")||'<div class="card"><b>Nenhuma apresentação agendada</b><span class="mut">Quando um dono vincular você a uma apresentação, ela aparece aqui.</span></div>'}}
  return{t:"Perfil",b:`<div class="card" style="text-align:center"><div class="thumb" style="margin:0 auto 6px">🎸</div><b class="big">${user.name}</b><span class="mut">Músico · ★ ${media("m",user.name)}</span></div>${field("Nome artístico",user.name)}${field("Gêneros","Sertanejo, MPB")}${field("Descrição","Voz e violão para animar a noite.")}<button class="btn" onclick="toast('Perfil salvo')">Salvar perfil</button>${sairBtn}`};
 }
 if(scr==="agenda"){const l=AP.map((a,i)=>[a,i]).filter(x=>x[0].local===user.est);return{t:"Apresentações",b:(l.map(([a,i])=>apCard(a,i,true)).join("")||'<div class="card"><b>Nenhuma apresentação ainda</b><span class="mut">Crie a primeira apresentação e escolha o músico.</span></div>')+`<h2>Nova apresentação</h2><label>Músico da apresentação</label><select class="in" id="ms">${MUS.map(m=>`<option value="${m.n}">${m.n} · ★ ${media("m",m.n)}</option>`).join("")}</select><label>Data e horário</label><input class="in" id="dt" value="Dom · 20:00"><label>Modo da apresentação</label><select class="in" id="md"><option value="livre">Livre: qualquer música</option><option value="repertorio">Repertório: só as músicas do músico</option></select><label>Limite de hypes por cliente</label><input class="in" id="lh" type="number" min="0" value="2"><label>Código da apresentação</label><input class="in" id="cd" value="${gerarCodigo()}"><p class="mut" style="margin:-2px 0 6px">Gerado pelo app. Você pode escrever o seu.</p><button class="btn" onclick="criarAp()">Criar apresentação</button>`}}
 return{t:"Perfil",b:`<div class="card" style="text-align:center"><div class="thumb" style="margin:0 auto 6px">🏪</div><b class="big">${user.est}</b><span class="mut">Dono · ${user.name} · ★ ${media("e",user.est)}</span></div>${field("Nome do estabelecimento",user.est)}${field("CNPJ","12.345.678/0001-90")}${field("Endereço","Rua das Flores, 100")}<button class="btn" onclick="toast('Perfil salvo')">Salvar perfil</button>${sairBtn}`};
}
function authView(){return `<div class="body"><div class="logo">🎤<b>Tocaí</b><span class="mut" style="font-size:14px;font-weight:400">Peça sua música, sem gritar.</span></div><div class="seg"><button class="${tab==="in"?"on":""}" onclick="tab='in';render()">Entrar</button><button class="${tab==="up"?"on":""}" onclick="tab='up';render()">Criar conta</button></div>`+(tab==="in"?`<label>E-mail</label><input class="in" placeholder="voce@exemplo.com"><label>Senha</label><input class="in" type="password" placeholder="••••••••"><button class="btn" onclick="entrar()">Entrar</button><h2>Acesso rápido para testar</h2><div class="opt"><button onclick="enter('c',DEMO.c)">Cliente</button><button onclick="enter('m',DEMO.m)">Músico</button><button onclick="enter('d',DEMO.d)">Dono</button></div>`:`<label>Quero criar uma conta de</label><div class="opt">${[["c","Cliente"],["m","Músico"],["d","Dono"]].map(o=>`<button class="${nr===o[0]?"on":""}" onclick="nr='${o[0]}';render()">${o[1]}</button>`).join("")}</div><label>${nr==="m"?"Nome artístico":"Seu nome"}</label><input class="in" id="nm" placeholder="Nome">`+(nr==="d"?`<label>Nome do estabelecimento</label><input class="in" id="en" placeholder="Ex.: Boate Azul"><label>CNPJ</label><input class="in" placeholder="00.000.000/0000-00"><label>Endereço</label><input class="in" placeholder="Rua, número, cidade">`:"")+`<label>E-mail</label><input class="in" placeholder="voce@exemplo.com"><label>Senha</label><input class="in" type="password" placeholder="••••••••"><button class="btn" onclick="cadastrar()">Criar conta</button>`)+`</div>`}
function ligarRotulos(){document.querySelectorAll("label").forEach((l,i)=>{const n=l.nextElementSibling;if(n&&/INPUT|SELECT/.test(n.tagName)){if(!n.id)n.id="campo"+i;l.htmlFor=n.id}})}
function render(){
 if(!user){$("#phone").innerHTML=authView();ligarRotulos();return}
 const v=view();
 $("#phone").innerHTML=`<div class="head">${v.back?`<button class="back" aria-label="Voltar" onclick="go('${v.back}')">‹</button>`:""}${v.t.startsWith("<")?`<div style="flex:1">${v.t}</div>`:`<h1>${v.t}</h1>`}</div><div class="body">${v.b}</div>${v.cta?`<button class="cta" onclick="irSolicitar()">${v.cta}</button>`:""}<div class="nav">${NAV[user.role].map(n=>`<button class="${scr===n[0]||(["est","presenca","buscar"].includes(scr)&&n[0]==="home")||((scr==="apres"||scr==="repert")&&n[0]==="agenda")?"on":""}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join("")}</div>`;ligarRotulos();
}
render();
</script>
</body>
</html>
